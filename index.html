<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firnas Motors</title>
  <meta name="description" content="Firnas Motors — coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e4e4e7;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.16;
      pointer-events: none;
    }

    .bg-glow--1 { top: -200px; left: -100px; background: #e87a20; }
    .bg-glow--2 { bottom: -250px; right: -150px; background: #c45e10; }

    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
      max-width: 540px;
    }

    .mark {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e87a20;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.85rem;
      background: linear-gradient(135deg, #e4e4e7 0%, #e87a20 52%, #c45e10 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #a1a1aa;
      font-weight: 300;
      line-height: 1.6;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>
  <main class="container">
    <div class="mark">Firnas Motors</div>
    <h1>Coming soon</h1>
    <p>Our new website is on the way.</p>
  </main>
</body>
</html>
